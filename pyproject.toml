[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memsift"
dynamic = ["version"]
description = "Find and review problems in coding agents' memory."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "memsift contributors" }]
keywords = [
  "ai-agents",
  "agent-memory",
  "memory-hygiene",
  "cli",
  "sqlite",
  "opencode",
  "local-first",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Arerii7/memsift"
Repository = "https://github.com/Arerii7/memsift"
Issues = "https://github.com/Arerii7/memsift/issues"
Changelog = "https://github.com/Arerii7/memsift/blob/master/CHANGELOG.md"

[project.scripts]
memsift = "memsift.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "memsift.__version__" }

[tool.setuptools.package-data]
memsift = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/memsift"]

[tool.coverage.report]
show_missing = true
fail_under = 85
