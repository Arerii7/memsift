[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memsift"
version = "0.1.0"
description = "Find and review problems in coding agents' memory."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "memsift" }]
keywords = ["ai-agents", "memory", "cli", "sqlite", "opencode"]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
memsift = "memsift.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memsift = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
