name: Bug report
description: Report something that does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a small synthetic example and the commands you ran.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version and memsift version.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Remove personal memories, credentials and other private data before posting.
